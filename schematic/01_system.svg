<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <rect width="1100" height="700" fill="#f7f5f0"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#1a1a1a">Sheet 01 - System Overview</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="12" fill="#555">GD32F407 + RC522 module + custom USB MSC | Rev F</text>
  <line x1="40" y1="82" x2="1060" y2="82" stroke="#ccc"/>

  <rect x="40" y="130" width="120" height="80" rx="6" fill="#fff" stroke="#2c5f4a" stroke-width="2"/>
  <text x="100" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#2c5f4a">USB-C</text>
  <text x="100" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">5V / Data</text>

  <rect x="220" y="130" width="140" height="80" rx="6" fill="#fff" stroke="#8a5a2b" stroke-width="2"/>
  <text x="290" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#8a5a2b">Power</text>
  <text x="290" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">ESD + LDO 3.3V</text>

  <rect x="430" y="110" width="220" height="120" rx="8" fill="#fff" stroke="#1a3a5c" stroke-width="2.5"/>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a3a5c">GD32F407VET6</text>
  <text x="540" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">USB | SPI1 | TIM</text>
  <text x="540" y="195" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">Custom MSC + ECC</text>

  <rect x="720" y="100" width="200" height="140" rx="6" fill="#fff" stroke="#5c1a3a" stroke-width="2"/>
  <text x="820" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c1a3a">RC522 MODULE</text>
  <text x="820" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">SPI + antenna onboard</text>
  <text x="820" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">Header J3</text>
  <text x="820" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">3.3V only</text>

  <rect x="430" y="280" width="120" height="70" rx="6" fill="#fff" stroke="#5c4a1a" stroke-width="2"/>
  <text x="490" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c4a1a">Buzzer</text>
  <text x="490" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">PWM</text>

  <rect x="580" y="280" width="120" height="70" rx="6" fill="#fff" stroke="#1a5c3a" stroke-width="2"/>
  <text x="640" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1a5c3a">LEDs</text>
  <text x="640" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">Status | RF</text>

  <rect x="40" y="280" width="140" height="70" rx="6" fill="#eef2ef" stroke="#2c5f4a" stroke-width="1.5"/>
  <text x="110" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#2c5f4a">Host PC</text>
  <text x="110" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">Custom MSC</text>

  <line x1="160" y1="170" x2="220" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="360" y1="170" x2="430" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="650" y1="160" x2="720" y2="160" stroke="#333" stroke-width="1.5"/>
  <line x1="540" y1="230" x2="540" y2="280" stroke="#333" stroke-width="1.5"/>
  <path d="M100 210 H430" stroke="#333" stroke-width="1.5" fill="none"/>
  <text x="250" y="202" font-family="Segoe UI, sans-serif" font-size="10" fill="#888">USB DP/DM</text>

  <rect x="40" y="400" width="1020" height="250" rx="8" fill="#fff" stroke="#ddd"/>
  <text x="60" y="435" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Notes</text>
  <text x="60" y="470" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">1. User places card on top of device (lid recess) - RC522 under lid reads UID</text>
  <text x="60" y="500" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">2. RC522 module on J3 (3V3 SPI) - antenna faces up toward the card</text>
  <text x="60" y="530" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">3. Buzzer/LED feedback - ECC - files via custom USB MSC</text>
  <text x="60" y="560" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">4. USB Type-C on enclosure edge for host PC</text>
  <text x="60" y="600" font-family="Segoe UI, sans-serif" font-size="12" fill="#888">Buy module: see bom/BUY.md</text>
