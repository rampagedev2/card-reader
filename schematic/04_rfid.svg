<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#f7f5f0"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#1a1a1a">Sheet 04 - RC522 Module Interface</text>
  <text x="40" y="68" font-family="Segoe UI, sans-serif" font-size="12" fill="#555">Ready module - no discrete MFRC522 / matching / antenna on main PCB</text>
  <line x1="40" y1="82" x2="1060" y2="82" stroke="#ccc"/>

  <rect x="80" y="120" width="280" height="320" rx="8" fill="#fff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a3a5c">MCU SPI1</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#222">
    <text x="100" y="200">3V3  ----------------</text>
    <text x="100" y="230">GND  ----------------</text>
    <text x="100" y="260">PA5  SCK  -----------</text>
    <text x="100" y="290">PA6  MISO -----------</text>
    <text x="100" y="320">PA7  MOSI -----------</text>
    <text x="100" y="350">PA4  NSS/SDA --------</text>
    <text x="100" y="380">PC4  RST  -----------</text>
    <text x="100" y="410">PC5  IRQ  -----------</text>
  </g>

  <rect x="450" y="140" width="100" height="280" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14">J3</text>
  <text x="500" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">1x8</text>
  <text x="500" y="260" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">header</text>

  <rect x="620" y="120" width="360" height="320" rx="8" fill="#fff" stroke="#5c1a3a" stroke-width="2"/>
  <text x="800" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5c1a3a">MOD1 RC522 module</text>
  <text x="800" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">~40 x 60 mm | antenna included</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#222">
    <text x="650" y="230">3.3V</text>
    <text x="650" y="260">RST</text>
    <text x="650" y="290">GND</text>
    <text x="650" y="320">IRQ</text>
    <text x="650" y="350">MISO</text>
    <text x="650" y="380">MOSI</text>
    <text x="650" y="410">SCK</text>
  </g>
  <text x="800" y="410" font-family="Consolas, monospace" font-size="13">SDA</text>

  <rect x="80" y="480" width="900" height="180" rx="8" fill="#fff" stroke="#ddd"/>
  <text x="100" y="520" font-family="Georgia, serif" font-size="15">Wiring rules</text>
  <text x="100" y="555" font-family="Segoe UI, sans-serif" font-size="13">1. Use 3.3V only - 5V can damage the module.</text>
  <text x="100" y="585" font-family="Segoe UI, sans-serif" font-size="13">2. Keep SPI wires short (&lt;10 cm) or mount module on main PCB headers.</text>
  <text x="100" y="615" font-family="Segoe UI, sans-serif" font-size="13">3. Pin order on cheap modules varies - match silkscreen on your module.</text>
</svg>
