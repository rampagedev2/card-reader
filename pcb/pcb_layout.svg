<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000">
  <rect width="900" height="1000" fill="#1e1e1e"/>
  <text x="40" y="40" font-family="Georgia, serif" font-size="20" fill="#e8e4dc">PCB Layout - Top View (RC522 module)</text>
  <text x="40" y="65" font-family="Segoe UI, sans-serif" font-size="12" fill="#999">~105 x 60 mm | 2-layer | fit AK-R-160 | module on header J3 | Rev G</text>

  <g transform="translate(140,100)">
    <rect x="0" y="0" width="480" height="560" fill="#0d3d2a" stroke="#7dcea0" stroke-width="3"/>
    <circle cx="28" cy="28" r="10" fill="#1e1e1e" stroke="#aaa"/>
    <circle cx="452" cy="28" r="10" fill="#1e1e1e" stroke="#aaa"/>
    <circle cx="28" cy="532" r="10" fill="#1e1e1e" stroke="#aaa"/>
    <circle cx="452" cy="532" r="10" fill="#1e1e1e" stroke="#aaa"/>

    <rect x="160" y="8" width="160" height="36" rx="4" fill="#333" stroke="#ccc"/>
    <text x="240" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#eee">USB-C</text>

    <rect x="40" y="60" width="60" height="36" fill="#4a3728" stroke="#c4a484"/>
    <text x="70" y="83" text-anchor="middle" font-size="10" fill="#eee" font-family="Segoe UI, sans-serif">ESD</text>
    <rect x="120" y="60" width="60" height="36" fill="#4a3728" stroke="#c4a484"/>
    <text x="150" y="83" text-anchor="middle" font-size="10" fill="#eee" font-family="Segoe UI, sans-serif">LDO</text>

    <rect x="120" y="130" width="220" height="200" fill="#1a2a40" stroke="#7aa2d4" stroke-width="2"/>
    <text x="230" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#b8d4f0">GD32F407</text>
    <text x="230" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#8899aa">LQFP-100</text>

    <rect x="40" y="180" width="60" height="36" fill="#333" stroke="#888"/>
    <text x="70" y="203" text-anchor="middle" font-size="10" fill="#ddd" font-family="Segoe UI, sans-serif">8MHz</text>

    <circle cx="400" cy="200" r="24" fill="#3a3020" stroke="#c4a050"/>
    <text x="400" y="205" text-anchor="middle" font-size="10" fill="#eeddcc" font-family="Segoe UI, sans-serif">BZ</text>
    <circle cx="360" cy="260" r="8" fill="#2d5a3a" stroke="#66dd66"/>
    <circle cx="390" cy="260" r="8" fill="#1a3a5a" stroke="#66aaff"/>

    <rect x="80" y="380" width="320" height="140" fill="#401a2a" stroke="#e080a0" stroke-width="2"/>
    <text x="240" y="430" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fcd">RC522 MODULE</text>
    <text x="240" y="455" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#c9a">plugs into J3 header</text>
    <text x="240" y="480" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#c9a">antenna on module</text>
  </g>

  <g transform="translate(140,720)" font-family="Segoe UI, sans-serif" fill="#ccc" font-size="13">
    <text x="0" y="0" fill="#e8e4dc" font-family="Georgia, serif" font-size="16">Notes</text>
    <text x="0" y="30">No RF keep-out on main PCB. Keep metal away from module antenna area.</text>
    <text x="0" y="55">J3 1x8 under / beside module footprint.</text>
  </g>
</svg>
